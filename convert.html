<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Custom Converter</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>֍ Custom Converter ֍</h1>
    <p>Convert your input using custom conversion logic</p>
</header>

<div class="container">
     <div class="toolbar">

        <button onclick="convert()">
            Convert
        </button>
    </div>
   

    <div class="section">

        <h2>Input</h2>

        <textarea
            id="input"
            placeholder="Paste your input here"
        ></textarea>

    </div>

    <div class="arrow">
        ↓
    </div>

    <div class="section">

        <h2>Output</h2>

        <textarea
            id="output"
            placeholder="Converted output will appear here"
        ></textarea>

    </div>

   

</div>

<script src="convert.js"></script>

<div class="footer">
  <div class="container">
    <div class="controls">

        <div class="control-row">

      <div class="toolbar">
             <a
                        class="link-button secondary"
                        href="https://chatgpt.com/c/6a3d066e-ec60-83eb-859d-f03c4c247fd4"
                        target="_blank"
                    >
                        Prompt
                    </a>
            
                    <a
                        class="link-button secondary"
                        href="https://github.com/danijelcecelja-svg/javasciptpages"
                        target="_blank"
                    >
                        Code
                    </a>
                    <a
                        class="link-button secondary"
                        href="https://danijelcecelja-svg.github.io/javasciptpages/index.html"
                        target="_blank"
                    >
                        Home
                    </a>
          
            </div>
         
      </div>  
        </div>
     <div id="version">
            Last modified:
            <script>
                document.write(document.lastModified);
            </script>
        </div>
      </div>  
</div>
</body>
</html>
