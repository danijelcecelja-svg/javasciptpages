<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danijel's Pages</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>Danijel's Pages</h1>
    <p>HTML tools and applications</p>
</header>

<div class="container">

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search pages..."
    >

    <div id="count" class="count"></div>

    <div id="pages" class="grid">
        <div class="status">
            Loading pages...
        </div>
    </div>

</div>

<script>

const OWNER =
    "danijelcecelja-svg";

const REPOSITORY =
    "javasciptpages";

const BRANCH =
    "main";

const PAGES_BASE =
    `https://${OWNER}.github.io/${REPOSITORY}/`;

const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPOSITORY}/git/trees/${BRANCH}?recursive=1`;

let pages = [];

function createTitle(filename) {

    return filename
        .replace(/\.html$/i, "")
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, char => char.toUpperCase());

}

function renderPages(filter = "") {

    const container =
        document.getElementById("pages");

    const count =
        document.getElementById("count");

    const filteredPages =
        pages.filter(page =>
            page.filename.toLowerCase().includes(
                filter.toLowerCase()
            ) ||
            page.title.toLowerCase().includes(
                filter.toLowerCase()
            )
        );

    count.textContent =
        `${filteredPages.length} page${filteredPages.length === 1 ? "" : "s"}`;

    if (filteredPages.length === 0) {

        container.innerHTML =
            `<div class="status">No pages found.</div>`;

        return;
    }

    container.innerHTML =
        filteredPages.map(page => `

            <div class="card">

                <h2>
                    ${escapeHtml(page.title)}
                </h2>

                <div class="filename">
                    ${escapeHtml(page.filename)}
                </div>

                <a
                    class="open-button"
                    href="${page.url}"
                >
                    Open
                </a>

            </div>

        `).join("");

}

function escapeHtml(value) {

    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

async function loadPages() {

    try {

        const response =
            await fetch(API_URL);

        if (!response.ok) {

            throw new Error(
                `GitHub API returned ${response.status}`
            );

        }

        const data =
            await response.json();

        pages =
            data.tree

                .filter(item =>
                    item.type === "blob" &&
                    item.path
                        .toLowerCase()
                        .endsWith(".html")
                )

                .filter(item =>
                    item.path
                        .toLowerCase() !== "index.html"
                )

                .map(item => ({

                    filename:
                        item.path,

                    title:
                        createTitle(
                            item.path.split("/").pop()
                        ),

                    url:
                        PAGES_BASE + item.path

                }))

                .sort((a, b) =>
                    a.title.localeCompare(b.title)
                );

        renderPages();

    } catch (error) {

        document.getElementById("pages").innerHTML = `

            <div class="error">

                Unable to load the pages from GitHub.

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}

document
    .getElementById("search")
    .addEventListener("input", event => {

        renderPages(event.target.value);

    });

loadPages();

</script>

</body>
</html>
