<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>JSON → WSE Converter</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>֍ JSON → WSE Converter ֍</h1>
    <p>Convert JSON lines directly to WSE import data</p>
</header>

<div class="container">

    <div class="toolbar">
        <button onclick="convert()">Convert</button>
        <button onclick="download()">Download CSV</button>
    </div>

    <div class="section">
        <h2>JSON Input</h2>
        <textarea
            id="input"
            placeholder="Paste your JSON lines here"
        ></textarea>
    </div>

    <div class="arrow">
        ↓
    </div>

    <div class="section">
        <h2>WSE Output</h2>
        <textarea
            id="output"
            placeholder="Final WSE CSV output will appear here"
        ></textarea>
    </div>

</div>

<script>

const OUTPUT_DELIMITER = ",";

const OUTPUT_HEADERS = [
    "UNIQUERECORDID",
    "CERTIFICATIONNUMBER",
    "CERTIFICATERECEIVED",
    "CERTIFICATIONDATE",
    "CERTIFICATIONORIGIN",
    "CERTIFICATIONTYPE",
    "LONGCOMMENTS",
    "DUEDATE_PSN",
    "INPROCESS_PSN",
    "ISSUERPARTY_PARTYNUMBER",
    "ITEMID",
    "LEADTIME",
    "LIABILITYAMOUNT_PSN",
    "NAME",
    "REVIEWED",
    "VALIDFROMDATE",
    "VALIDTODATE",
    "VENDCERTIFICATIONSTATEID_IFACTO",
    "VENDOR_NAME",
    "VENDOR_PARTYNUMBER"
];

function getJsonRecords(text) {

    const lines = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean);

    const seenRegistraties = new Set();
    const records = [];

    for (let start = 0; start < lines.length; start += 1000) {

        const batch = lines.slice(start, start + 1000);

        batch.forEach(line => {

            try {

                const obj = JSON.parse(line);

                let reg = obj["registratienummer"];
                const vest = obj["vestigingsnummer"];

                if (!reg || typeof reg !== "string") {
                    return;
                }

                reg = reg.trim().toUpperCase();

                if (!reg.startsWith("KDB") || seenRegistraties.has(reg)) {
                    return;
                }

                if (!vest || String(vest).trim() === "") {
                    return;
                }

                seenRegistraties.add(reg);

                obj["registratienummer"] = reg;

                records.push(obj);

            } catch (e) {
                throw new Error(
                    "Invalid JSON on input line " +
                    (start + batch.indexOf(line) + 1) +
                    ": " + e.message
                );
            }

        });

    }

    return records;
}

function parseCsvLine(line) {

    const values = [];
    let value = "";
    let insideQuotes = false;

    for (let i = 0; i < line.length; i++) {

        const character = line[i];

        if (character === '"') {

            if (insideQuotes && line[i + 1] === '"') {
                value += '"';
                i++;
            } else {
                insideQuotes = !insideQuotes;
            }

        } else if (character === "," && !insideQuotes) {

            values.push(value);
            value = "";

        } else {

            value += character;

        }

    }

    values.push(value);

    return values;
}

function getValue(obj, fieldName) {

    const value = obj[fieldName];

    if (value === null || value === undefined) {
        return "";
    }

    return String(value).trim();
}

function convertDate(value) {

    if (!value) {
        return "";
    }

    const parts = value.split("/");

    if (parts.length !== 3) {
        return value;
    }

    const day = parts[0].padStart(2, "0");
    const month = parts[1].padStart(2, "0");
    const year = parts[2];

    return `${month}/${day}/${year} 00:00:00`;
}

function padVestigingsnummer(value) {

    const cleaned = String(value).trim();

    if (cleaned === "") {
        return "";
    }

    return cleaned.padStart(10, "0");
}

function convertLine(obj) {

    const registratienummer =
        getValue(obj, "registratienummer");

    const kwaliteitsbewijsType =
        getValue(obj, "kwaliteitsbewijs_type");

    const kwaliteitsbewijsNaam =
        getValue(obj, "kwaliteitsbewijs_naam");

    const vestigingsnummer =
        getValue(obj, "vestigingsnummer");

    const registratieGeldigVan =
        getValue(obj, "registratie_geldig_van");

    const registratieGeldigTot =
        getValue(obj, "registratie_geldig_tot");

    const registratieStatus =
        getValue(obj, "registratie_status");

    const naamOnderneming =
        getValue(obj, "naam_onderneming");

    const paddedVestigingsnummer =
        padVestigingsnummer(vestigingsnummer);

    let vendorName = naamOnderneming;

    if (
        vendorName === "" ||
        vendorName.toLowerCase() === "onbekend"
    ) {
        vendorName = "Naam onbekend";
    } else {
        vendorName = vendorName.substring(0, 160);
    }

    let certificationState = "";

    switch (registratieStatus.toLowerCase()) {

        case "actief":
            certificationState = "AC";
            break;

        case "niet actief":
        case "stopgezet":
            certificationState = "PA";
            break;

        default:
            certificationState = "";
            break;
    }

    const name =
        `${kwaliteitsbewijsType} - ${kwaliteitsbewijsNaam}-${paddedVestigingsnummer}`;

    return [
        registratienummer,
        registratienummer,
        "",
        "",
        "",
        "WSE",
        "",
        "",
        "",
        "0887010362",
        "",
        "",
        "",
        name,
        "",
        convertDate(registratieGeldigVan),
        convertDate(registratieGeldigTot),
        certificationState,
        vendorName,
        vestigingsnummer
    ];
}

function escapeCsvValue(value) {

    if (value === null || value === undefined) {
        return "";
    }

    const stringValue = String(value);

    if (
        stringValue.includes(OUTPUT_DELIMITER) ||
        stringValue.includes('"') ||
        stringValue.includes("\n") ||
        stringValue.includes("\r")
    ) {
        return `"${stringValue.replace(/"/g, '""')}"`;
    }

    return stringValue;
}

function convert() {

    const input = document.getElementById("input").value;
    const outputElement = document.getElementById("output");

    try {

        if (!input.trim()) {
            outputElement.value = "";
            return;
        }

        const records = getJsonRecords(input);

        const outputRows = [OUTPUT_HEADERS];

        records.forEach(obj => {
            outputRows.push(convertLine(obj));
        });

        const output = outputRows
            .map(row =>
                row
                    .map(escapeCsvValue)
                    .join(OUTPUT_DELIMITER)
            )
            .join("\r\n");

        outputElement.value = output;

    } catch (e) {

        outputElement.value = "";
        alert(e.message);

    }

}

function download() {

    const csv = document.getElementById("output").value;

    if (!csv) {
        alert("Convert the input first.");
        return;
    }

    const blob = new Blob(
        [csv],
        { type: "text/csv;charset=utf-8;" }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "wse_output.csv";
    a.click();

    URL.revokeObjectURL(url);

}

</script>

</body>
