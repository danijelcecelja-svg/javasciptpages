<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SFPI IAM Converter</title>
</head>
<body>
  <h2>֍ SFPI IAM Converter ֍</h2>

  <button onclick="convert()">Convert</button>
  <br><br>

  <a href="https://chatgpt.com/c/6a3d066e-ec60-83eb-859d-f03c4c247fd4" target="_blank">prompt</a>
  <br><br>

  <a href="https://github.com/danijelcecelja-svg/javasciptpages/edit/main/converters/iam.html" target="_blank">code</a>
  <br><br>

  <h3>Input</h3>

  <textarea id="input" rows="15" cols="120" placeholder="Paste your aangeleverd data here"></textarea>

  <br><br>

  <h3>Output</h3>

  <textarea id="output" rows="15" cols="120"></textarea>

  <script>
    const INPUT_DELIMITER = ",";
    const OUTPUT_DELIMITER = ",";

    const OUTPUT_HEADERS = [
      "Vestigingsnummer",
      "Ondernemingsnummer",
      "Onderneming naam",
      "Integration ID",
      "Aanspreking",
      "Contact Voornaam",
      "Contact Naam",
      "Contact E-Mail",
      "Contact GSM",
      "Contact Telefoon",
      "Functietitel",
      "Specifieke lijst Contactpersonen",
      "Telefoonnummer",
      "IAM Derden Rol",
      "IAM Login",
      "MLP Technische Rol"
    ];

    function parseCsvLine(line) {
      const values = [];
      let value = "";
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const character = line[i];

        if (character === '"') {
          if (insideQuotes && line[i + 1] === '"') {
            value += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (character === INPUT_DELIMITER && !insideQuotes) {
          values.push(value);
          value = "";
        } else {
          value += character;
        }
      }

      values.push(value);

      return values;
    }

    function cleanValue(value) {
      let cleaned = String(value || "").trim();

      if (
        cleaned.length >= 2 &&
        cleaned.startsWith('"') &&
        cleaned.endsWith('"')
      ) {
        cleaned = cleaned.substring(1, cleaned.length - 1);
      }

      return cleaned;
    }

    function getValue(columns, columnIndex, fieldName) {
      const index = columnIndex[fieldName];

      if (index === undefined) {
        return "";
      }

      return cleanValue(columns[index]);
    }

    function convertLine(columns, columnIndex) {
      const partnerVestigingNaam = getValue(
        columns,
        columnIndex,
        "PARTNER_VESTIGINGNAAM"
      );

      const vestigingsnummer = getValue(
        columns,
        columnIndex,
        "VESTIGING_KBO"
      );

      const ondernemingsnummer = getValue(
        columns,
        columnIndex,
        "VESTIGING_HOOFDZETEL_KBO"
      );

      const contactNaam = getValue(
        columns,
        columnIndex,
        "CONTACT_NAAM"
      );

      const contactVoornaam = getValue(
        columns,
        columnIndex,
        "CONTACT_VOORNAAM"
      );

      const contactGsm = getValue(
        columns,
        columnIndex,
        "CONTACT_GSM"
      );

      const contactTelefoon = getValue(
        columns,
        columnIndex,
        "CONTACT_TELEFOON"
      );

      const contactEmail = getValue(
        columns,
        columnIndex,
        "CONTACT_EMAIL"
      );

      const rollenLijst = getValue(
        columns,
        columnIndex,
        "ROLLEN_LIJST"
      );

      const mlpRollenLijst = getValue(
        columns,
        columnIndex,
        "MLPROLLEN_LIJST"
      );

      const mlpRollenAantal = getValue(
        columns,
        columnIndex,
        "MLPROLLEN_AANTAL"
      );

      const derdenTamGebruikersnaam = getValue(
        columns,
        columnIndex,
        "DERDEN_TAM_GEBRUIKERSNAAM"
      );

      const integrationId = `${ondernemingsnummer} ${contactEmail}`;

      let mlpTechnischeRol = "";

      if (Number(mlpRollenAantal) > 0) {
        mlpTechnischeRol = mlpRollenLijst;
      }

      return [
        vestigingsnummer,
        ondernemingsnummer,
        partnerVestigingNaam,
        integrationId,
        "",
        contactVoornaam,
        contactNaam,
        contactEmail,
        contactGsm,
        contactTelefoon,
        "",
        "",
        contactTelefoon,
        rollenLijst,
        derdenTamGebruikersnaam,
        mlpTechnischeRol
      ];
    }

    function escapeCsvValue(value) {
      if (value === null || value === undefined) {
        return "";
      }

      const stringValue = String(value);

      if (
        stringValue.includes(OUTPUT_DELIMITER) ||
        stringValue.includes('"') ||
        stringValue.includes("\n") ||
        stringValue.includes("\r")
      ) {
        return `"${stringValue.replace(/"/g, '""')}"`;
      }

      return stringValue;
    }

    function convert() {
      const text = document.getElementById("input").value.trim();

      if (!text) {
        document.getElementById("output").value = "";
        return;
      }

      const lines = text.split(/\r?\n/);

      if (lines.length === 0) {
        document.getElementById("output").value = "";
        return;
      }

      const headers = parseCsvLine(lines[0]);

      const columnIndex = {};

      headers.forEach((header, index) => {
        columnIndex[cleanValue(header)] = index;
      });

      const outputRows = [];

      outputRows.push(OUTPUT_HEADERS);

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) {
          continue;
        }

        const columns = parseCsvLine(lines[i]);

        const outputRow = convertLine(columns, columnIndex);

        outputRows.push(outputRow);
      }

      const output = outputRows
        .map(row =>
          row
            .map(value => escapeCsvValue(value))
            .join(OUTPUT_DELIMITER)
        )
        .join("\n");

      document.getElementById("output").value = output;
    }
  </script>

  <div id="version">
    Last modified:
    <script>
      document.write(document.lastModified);
    </script>
  </div>

</body>
</html>
